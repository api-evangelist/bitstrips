name: Bitstrips
description: 'Bitstrips was a Toronto-based consumer software company, founded in 2007
  by Jacob "Ba" Blackstock, that created the personalized comic platform Bitstrips and
  the personal-avatar app Bitmoji. Snap Inc. acquired Bitstrips in March 2016, retired
  the original Bitstrips comic product, and now operates the technology as Bitmoji.
  The public developer surface today is the Bitmoji Direct API (Bitmoji for Developers):
  an OAuth2 authorization-code-with-PKCE flow via www.bitmoji.com/connect that grants
  third-party apps access to a user''s avatar ID, sticker packs, and sticker search,
  served from bitmoji.api.snapchat.com/direct. Note that Snap has deprecated the
  "Bitmoji For Identity" product; the standalone stickers and search integrations
  remain documented. This profile was surfaced as a Kleiner Perkins portfolio company
  and enriched from the public Bitmoji developer documentation.'
